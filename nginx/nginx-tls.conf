# Продакшн-вариант nginx/nginx.conf: то же самое, но с TLS.
# Подключается через docker-compose.prod.yml (см. .env.example, COMPOSE_FILE).
# Базовый nginx.conf остаётся http-only для локального запуска.
#
# Домена здесь НЕТ намеренно: сертификат выписывается с --cert-name site
# (deploy/init-tls.sh), поэтому путь к нему фиксированный, а server_name _
# отвечает на любой Host -- сайт на этом сервере один. Домен задаётся ровно
# в одном месте, в корневом .env, и рассинхронизироваться двум файлам негде.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 8m;  # a bit above the backend's own photo-size cap

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Резолвер и $api_upstream-переменная -- зачем именно так, см. комментарии
    # в nginx/nginx.conf: имена контейнеров должны разрешаться на каждом
    # запросе, иначе после пересборки сервиса nginx стучится в старый IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # :80 остаётся открытым только ради двух вещей: ACME-проверки при выпуске
    # и продлении сертификата и редиректа всех остальных на https.
    server {
        listen 80;
        server_name _;

        # Должен идти ДО редиректа: certbot кладёт файл проверки в этот
        # webroot (общий том с сервисом certbot) и Let's Encrypt читает его
        # именно по http -- редирект на https сломал бы продление.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            # www сразу на голый домен, минуя лишний прыжок через https://www.
            #
            # Редирект живёт ЗДЕСЬ, а не на уровне server, намеренно: серверный
            # if сработал бы и на /.well-known/acme-challenge/, Let's Encrypt
            # пошёл бы по редиректу на https (он следует за ними), а на :443
            # этого пути нет -- и проверка www провалила бы весь выпуск.
            # Location /.well-known/... выше -- более длинный префикс, поэтому
            # он выигрывает и до этого блока ACME-запросы не доходят.
            if ($host ~* ^www\.(.+)$) {
                return 301 https://$1$request_uri;
            }
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Фиксированный путь -- следствие --cert-name site (см. шапку файла).
        ssl_certificate     /etc/letsencrypt/live/site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/site/privkey.pem;

        # Канонический origin -- без www. Второй живой origin означал бы
        # раздвоенные куки сессии (кука с голого домена не уедет на www),
        # дубли страниц в поиске и расхождение с NEXT_PUBLIC_SITE_URL, который
        # вшит в бандл ровно один. Регулярка вместо имени домена -- по той же
        # причине, что и --cert-name site: домен задан только в .env.
        if ($host ~* ^www\.(.+)$) {
            return 301 https://$1$request_uri;
        }

        # HSTS включён вместе с сертификатом, не раньше: на http-origin
        # браузеры его игнорируют, а после включения он намертво запрещает
        # откат на http для этого домена на два года.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # НЕ $proxy_add_x_forwarded_for -- см. nginx/nginx.conf: uvicorn
            # берёт самую левую запись, и клиент мог бы подделать свой IP и
            # обойти rate limit.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /media/players/ {
            alias /media/players/;
            add_header Cache-Control "public, max-age=86400";
            # Свой add_header отменяет наследование серверных -- повторяем.
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Разделение владения заголовками на страницах сайта.
            #
            # Next.js ставит свой полный набор сам (next.config.ts + proxy.ts,
            # включая CSP с nonce и X-Frame-Options: DENY). Серверные
            # add_header выше добавлялись СВЕРХУ, и в каждом ответе приезжало
            # по два X-Content-Type-Options, Referrer-Policy,
            # Permissions-Policy и X-Frame-Options -- причём у последнего с
            # разными значениями (DENY от Next и SAMEORIGIN отсюда), а
            # конфликтующий X-Frame-Options часть браузеров считает
            # невалидным и не применяет вовсе. На Railway этого не было видно:
            # там nginx'а нет и заголовки ставил только Next.
            #
            # Свой add_header в location отменяет наследование серверных, так
            # что достаточно перечислить здесь то, чем владеет именно граница.
            # А это ровно HSTS: TLS терминируется тут, значит и заголовок про
            # него один и отсюда (upstream'ный при этом снимается).
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            proxy_hide_header Strict-Transport-Security;
        }
    }
}
