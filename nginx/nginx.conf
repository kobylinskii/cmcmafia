# Reverse proxy in front of the Next.js frontend and the FastAPI backend.
# Both live on the SAME public origin here on purpose: it lets the browser
# talk to /api/* same-origin (no CORS, cookies just work) and keeps
# NEXT_PUBLIC_API_URL empty in the frontend build (see frontend/.env.example).
#
# HTTP only for now. For production, put this behind certbot (or terminate
# TLS at whatever's in front of this box) and redirect :80 -> :443 -- see
# ARCHITECTURE.md, deployment section.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 8m;  # a bit above the backend's own photo-size cap

    # Статику Next отдавал без сжатия вовсе: один css-бандл весил 45 КБ на
    # проводе там, где gzip делает из него ~8. Уровень 5, а не 9 -- дальше
    # выигрыш в байтах единицы процентов, а процессорное время растёт заметно.
    # Картинки и шрифты (woff2) уже сжаты, повторно их жать бессмысленно.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Заголовки безопасности задаются один раз здесь, а не в каждом location:
    # add_header НЕ наследуется в тот location, где есть свой add_header, --
    # поэтому в блоке /media/players/ они продублированы явно.
    #
    # HSTS сознательно НЕ включён: стек пока слушает только :80, и Strict-
    # Transport-Security на http-origin браузеры игнорируют, а после
    # включения TLS он намертво запретит откат на http (включать вместе с
    # сертификатом, не раньше).

    # Имена контейнеров разрешаются на КАЖДОМ запросе, а не один раз при старте.
    # Блок upstream (или proxy_pass с именем строкой) резолвит адрес при чтении
    # конфига и держит его вечно: после `docker compose up -d --build frontend`
    # контейнер поднимается с новым IP, nginx продолжает стучаться в старый и
    # отдаёт 502 на весь сайт, пока его самого не перезапустят. Резолвер --
    # встроенный DNS Docker на 127.0.0.11, он есть в любой compose-сети.
    #
    # Переменная в proxy_pass обязательна: без неё nginx резолвит имя на этапе
    # конфигурации и резолвер не используется вовсе.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # X-Forwarded-For задаётся как $remote_addr, а НЕ $proxy_add_x_forwarded_for:
    # последний дописывает реальный адрес справа к тому, что прислал клиент, а
    # uvicorn при FORWARDED_ALLOW_IPS=* берёт САМУЮ ЛЕВУЮ запись. В связке это
    # значит, что любой мог прислать свой X-Forwarded-For и получить личную
    # корзину rate limit, то есть обойти лимиты полностью. Здесь nginx --
    # единственный источник этого заголовка, и подделать его нельзя.
    #
    # Если перед этим nginx когда-нибудь появится ещё один прокси (Cloudflare,
    # балансировщик), $remote_addr станет его адресом: тогда нужно не возвращать
    # $proxy_add_x_forwarded_for, а включить ngx_http_realip_module
    # (set_real_ip_from <адрес прокси>; real_ip_header X-Forwarded-For;) --
    # он подставит настоящий клиентский IP в $remote_addr, и строки ниже
    # продолжат работать как есть.
    server {
        listen 80;
        server_name _;

        # Не даём браузеру угадывать тип по содержимому: загруженный
        # пользователем файл, отданный как text/html, -- это XSS.
        add_header X-Content-Type-Options "nosniff" always;
        # Кликджекинг на админку: фреймить сайт незачем.
        add_header X-Frame-Options "SAMEORIGIN" always;
        # Полный URL страницы (включая /mafia/admin/...) не должен утекать в
        # Referer сторонним сайтам.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # API браузера, которыми сайт не пользуется.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /media/players/ {
            # Served directly from the shared volume -- faster than round-tripping
            # through the API process for static files. Must match the backend's
            # own StaticFiles mount path (see backend/app/main.py).
            alias /media/players/;
            add_header Cache-Control "public, max-age=86400";
            # Свой add_header отменяет наследование серверных, поэтому
            # nosniff тут повторён явно -- и именно здесь он нужнее всего:
            # это единственное место, куда попадает загруженный файл.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
