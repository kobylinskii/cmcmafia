# Reverse proxy in front of the Next.js frontend and the FastAPI backend.
# Both live on the SAME public origin here on purpose: it lets the browser
# talk to /api/* same-origin (no CORS, cookies just work) and keeps
# NEXT_PUBLIC_API_URL empty in the frontend build (see frontend/.env.example).
#
# HTTP only for now. For production, put this behind certbot (or terminate
# TLS at whatever's in front of this box) and redirect :80 -> :443 -- see
# ARCHITECTURE.md, deployment section.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 8m;  # a bit above the backend's own photo-size cap

    # Имена контейнеров разрешаются на КАЖДОМ запросе, а не один раз при старте.
    # Блок upstream (или proxy_pass с именем строкой) резолвит адрес при чтении
    # конфига и держит его вечно: после `docker compose up -d --build frontend`
    # контейнер поднимается с новым IP, nginx продолжает стучаться в старый и
    # отдаёт 502 на весь сайт, пока его самого не перезапустят. Резолвер --
    # встроенный DNS Docker на 127.0.0.11, он есть в любой compose-сети.
    #
    # Переменная в proxy_pass обязательна: без неё nginx резолвит имя на этапе
    # конфигурации и резолвер не используется вовсе.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # X-Forwarded-For задаётся как $remote_addr, а НЕ $proxy_add_x_forwarded_for:
    # последний дописывает реальный адрес справа к тому, что прислал клиент, а
    # uvicorn при FORWARDED_ALLOW_IPS=* берёт САМУЮ ЛЕВУЮ запись. В связке это
    # значит, что любой мог прислать свой X-Forwarded-For и получить личную
    # корзину rate limit, то есть обойти лимиты полностью. Здесь nginx --
    # единственный источник этого заголовка, и подделать его нельзя.
    #
    # Если перед этим nginx когда-нибудь появится ещё один прокси (Cloudflare,
    # балансировщик), $remote_addr станет его адресом: тогда нужно не возвращать
    # $proxy_add_x_forwarded_for, а включить ngx_http_realip_module
    # (set_real_ip_from <адрес прокси>; real_ip_header X-Forwarded-For;) --
    # он подставит настоящий клиентский IP в $remote_addr, и строки ниже
    # продолжат работать как есть.
    server {
        listen 80;
        server_name _;

        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /media/players/ {
            # Served directly from the shared volume -- faster than round-tripping
            # through the API process for static files. Must match the backend's
            # own StaticFiles mount path (see backend/app/main.py).
            alias /media/players/;
            add_header Cache-Control "public, max-age=86400";
        }

        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
