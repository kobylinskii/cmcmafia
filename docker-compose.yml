# Драйвер логов по умолчанию -- json-file без ограничений: файл растёт, пока не
# кончится диск, и на хостинге это вопрос времени, а не «если». Три файла по
# 10 МБ на сервис -- потолок ~150 МБ на весь стек.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      # Пароль берётся из окружения хоста; дефолт оставлен, чтобы локальный
      # `docker compose up` работал из коробки. ПЕРЕД ХОСТИНГОМ задать свой:
      #   echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> .env
      # Порт наружу не проброшен, база видна только внутри compose-сети, но
      # дефолтный пароль в публичном репозитории -- всё равно плохая отправная
      # точка, и менять его после первого запуска дороже (том уже создан с ним).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: mafia
    volumes:
      # НЕ /var/lib/postgresql/data: начиная с 18-й версии образ хранит данные
      # в подкаталоге с номером major-версии (/var/lib/postgresql/18/docker),
      # чтобы работал pg_upgrade между версиями. Монтирование по старому пути
      # образ считает ошибкой и отказывается стартовать -- см.
      # docker-library/postgres#1259.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mafia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *default-logging

  api:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      # Перекрывают значения из backend/.env: тот файл рассчитан на запуск
      # uvicorn прямо на хосте (там postgres/redis доступны как localhost),
      # а внутри compose-сети адреса -- это имена сервисов. env_file читается
      # первым, environment побеждает.
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/mafia
      REDIS_URL: redis://redis:6379/0
      # Единственный, кто ходит в API -- nginx из этой же сети, поэтому его
      # X-Forwarded-For можно доверять. Без этого uvicorn доверяет заголовку
      # только с 127.0.0.1, и все rate limit'ы считаются по IP контейнера
      # nginx, то есть схлопываются в одну корзину на весь сайт целиком
      # (см. backend/app/rate_limit.py). Безопасно ровно до тех пор, пока
      # порт 8000 не проброшен наружу -- см. комментарий про ports ниже.
      FORWARDED_ALLOW_IPS: "*"
      # Стек из коробки слушает только :80, а браузер выбрасывает Secure-куки
      # на http-origin -- с COOKIE_SECURE=true логин в админку возвращает 200,
      # но сессия не сохраняется. Как только перед nginx появится TLS,
      # выставить COOKIE_SECURE=true в окружении хоста.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - media_players:/app/media/players
    # /health отдаёт сам FastAPI (app/main.py). Проверка нужна не ради
    # красоты: контейнер поднимается командой `alembic upgrade head &&
    # uvicorn`, и пока миграции идут, api уже "Up", но ещё не отвечает.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Порт наружу НЕ пробрасывается: API доступен только через nginx
    # (ARCHITECTURE.md, раздел 10). С проброшенным портом FORWARDED_ALLOW_IPS=*
    # позволил бы кому угодно подделать X-Forwarded-For и обойти rate limit,
    # а /api/bot/* оказался бы доступен из интернета в обход прокси.
    # Для разовой локальной отладки: docker compose run --service-ports api

  bot:
    build: ./bot
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
      - redis
    env_file:
      # Создать перед первым запуском, иначе compose не стартует вообще:
      # cp bot/.env.example bot/.env
      - ./bot/.env
    environment:
      # То же, что у api: внутри compose-сети бэкенд -- это имя сервиса,
      # а не localhost, на который рассчитан .env для запуска бота с хоста.
      API_BASE_URL: http://api:8000
      # FSM бота: без внешнего хранилища незавершённая регистрация терялась
      # при каждом рестарте контейнера (см. bot/bot.py, build_storage).
      REDIS_URL: redis://redis:6379/0
    networks:
      # default -- чтобы видеть api и redis по именам сервисов.
      - default
      # telegram6 -- ради выхода в интернет по IPv6. IPv4-адрес
      # api.telegram.org с российского хостинга не отвечает, и это
      # единственный способ боту вообще добраться до Telegram.
      - telegram6

  frontend:
    build:
      context: ./frontend
      args:
        # Пусто -> клиент ходит на /api того же домена, nginx проксирует на api.
        # См. frontend/.env.example про разницу между этой переменной и
        # API_INTERNAL_URL ниже (эта вшивается в бандл на этапе сборки).
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_BOT_USERNAME: "${NEXT_PUBLIC_BOT_USERNAME:-}"
        # Абсолютный origin сайта -- нужен для sitemap.xml и robots.txt, там
        # относительные URL невалидны. Обязательно задать перед проддеплоем:
        # NEXT_PUBLIC_SITE_URL=https://cmcmafia.ru docker compose build frontend
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost}"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Сервер Next.js (не браузер) ходит к бэкенду напрямую по имени сервиса.
      API_INTERNAL_URL: http://api:8000

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - frontend
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_players:/media/players:ro

networks:
  default:
  # Отдельная сеть вместо enable_ipv6 на default: у api uvicorn слушает только
  # IPv4, и если бы соседи стали резолвить его ещё и в AAAA, часть соединений
  # внутри стека начала бы упираться в несуществующий слушатель. IPv6 нужен
  # ровно одному сервису -- боту, ему одному его и даём.
  telegram6:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:cafe:1::/64

volumes:
  postgres_data:
  media_players:
